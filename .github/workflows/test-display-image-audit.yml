name: Verify display image audit
on:
  pull_request:
    paths:
      - 'scripts/display-image-audit.mjs'
      - 'tests/display-image-audit.test.mjs'
      - '.github/workflows/test-display-image-audit.yml'
      - 'js/artist-images.js'
      - 'js/verified-official-artwork.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/display-image-audit.mjs
      - name: Run regression suite
        run: npm test
      - name: Audit existing catalog without writing
        run: node scripts/display-image-audit.mjs --audit
