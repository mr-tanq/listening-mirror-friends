name: Probe official NL venue sources (read-only research)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/probe-venue-sources.mjs'
      - '.github/workflows/probe-venue-sources.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe venue robots, sitemaps, structured data and feeds
        run: node scripts/probe-venue-sources.mjs
