name: Test Commons identity photo matching
on:
  pull_request:
    paths:
      - 'scripts/commons-depicts-photos.mjs'
      - 'scripts/wikimedia-artist-photos.mjs'
      - 'scripts/musicbrainz-identity.mjs'
      - 'tests/commons-depicts-photos.test.mjs'
      - '.github/workflows/test-commons-depicts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full offline test suite
        run: npm test
      - name: Audit existing image coverage without external calls
        run: node scripts/audit-deciding-images.mjs
