name: Update event catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-events.yml'
      - 'scripts/fetch-events.mjs'
      - 'scripts/partner-feeds.mjs'
      - 'scripts/venue-posters.mjs'
      - 'scripts/floyd-calendar.mjs'
      - 'scripts/fuzzclub-calendar.mjs'
      - 'scripts/anclub-index.mjs'
      - 'scripts/catalog-audit.mjs'
      - 'scripts/venue-dedupe.mjs'
      - 'scripts/event-image-recovery.mjs'
      - 'scripts/podiuminfo-images.mjs'
      - 'js/artist-images.js'
      - 'data/artist-images.json'
      - 'scripts/verified-posters.mjs'
      - 'data/verified-event-images.json'
      - 'data/editorial-supplements.json'
      - 'scripts/technopolis-watch.mjs'
      - 'data/venue-registry.json'
      - 'data/partner-feeds.json'
      - 'data/artist-watchlist.json'
      - 'data/curated-genres.json'
      - 'data/verified-events.json'
      - 'js/model.js'
      - 'js/taste-engine.js'
      - 'tests/**'
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-events
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Friends Edition
        uses: actions/checkout@v4
      - name: Check out existing public discovery adapters (read-only)
        uses: actions/checkout@v4
        with:
          repository: mr-tanq/concerts
          path: .source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing scraper dependencies
        run: npm ci --prefix .source --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Verify Greece feed against original More.com parser
        run: node tests/greece-integration.mjs
      - name: Update public NL/BE/GR concert catalog
        env:
          CATALOG_DAYS: '100'
          NEW_ARTISTS_PER_RUN: '0'  # Public agenda cache is the fallback; direct event pages may return HTTP 403
          FESTIVAL_TIME_BUDGET_MS: '480000'
          NEW_GENRE_LOOKUPS_PER_RUN: '60'
          PODIUMINFO_IMAGE_REQUESTS: '45'
          PODIUMINFO_IMAGE_TIME_MS: '150000'
        run: node scripts/fetch-events.mjs
      - name: Commit public catalog and scraper cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/discovery-cache.json data/artist-tags.json data/source-audit.json data/podiuminfo-image-cache.json data/artist-images.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh concert feed and artist genre metadata"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                echo "Public concert catalog successfully published"
                exit 0
              fi
              echo "Concurrent update detected (attempt $attempt); retrying..."
              sleep 3
            done
            echo "Could not publish catalog after 8 attempts" >&2
            exit 1
          fi
