name: Validate Friends Edition
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/validate-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run preference and catalog unit tests
        run: npm test
      - name: Check frontend JavaScript syntax
        run: |
          node --check js/model.js
          node --check js/app.js
